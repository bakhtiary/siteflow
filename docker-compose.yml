services:
  frontend:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - siteflow

  api:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://siteflow:siteflow@postgres:5432/siteflow
      WEBSITE_STORAGE_BACKEND: local
      WEBSITE_OUTPUT_DIR: /app/websites
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./website-data:/app/websites
    networks:
      - siteflow

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: siteflow
      POSTGRES_USER: siteflow
      POSTGRES_PASSWORD: siteflow
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - vitaweby-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U siteflow -d siteflow"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - siteflow

networks:
  siteflow:
    driver: bridge

volumes:
  vitaweby-postgres-data:
