name: Backend Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  IMAGE_REPOSITORY: europe-west3-docker.pkg.dev/siteflow-498414/siteflow/siteflow-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: 'projects/539481263477/locations/global/workloadIdentityPools/github-pool/providers/github-provider'
          service_account: 'github-actions@siteflow-498414.iam.gserviceaccount.com'

      - uses: actions/checkout@v4

      - name: Build backend Docker image
        run: |
          docker build \
            --file backend/Dockerfile \
            --tag "$IMAGE_REPOSITORY:${GITHUB_SHA}" \
            --tag "$IMAGE_REPOSITORY:latest" \
            backend

      - name: Authenticate to Google Cloud
        if: github.event_name != 'pull_request'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Google Cloud SDK
        if: github.event_name != 'pull_request'
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        if: github.event_name != 'pull_request'
        run: gcloud auth configure-docker europe-west3-docker.pkg.dev --quiet

      - name: Push backend Docker image
        if: github.event_name != 'pull_request'
        run: |
          docker push "$IMAGE_REPOSITORY:${GITHUB_SHA}"
          docker push "$IMAGE_REPOSITORY:latest"
